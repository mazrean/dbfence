name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      # ko pushes ghcr.io/mazrean/dbfence with the workflow GITHUB_TOKEN.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            dbfence
            homebrew-tap

      # ko reads registry credentials from the Docker config, not from the
      # GITHUB_TOKEN environment variable below (the App token).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: assets
          path: dist/
