# End-to-end test on managed servers: Aurora Serverless v2 (ECS task started
# by ecspresso) and Cloud SQL (Cloud Run job). Each job runs e2e/run.sh in a
# container next to the database. The cloud resources and the variables of
# the e2e-aws and e2e-gcp environments come from Terraform: see docs/e2e.md.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - e2e/**
      - .github/workflows/e2e.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Build dbfence
        run: go build -o dist/e2e/dbfence .
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: dbfence-e2e
          path: dist/e2e/dbfence
          retention-days: 1

  aws-image:
    needs: build
    runs-on: ubuntu-latest
    environment: e2e-aws
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: dbfence-e2e
          path: e2e

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "image=$REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ vars.DBFENCE_E2E_ECR_REPOSITORY }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: e2e
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}

  aws:
    needs: aws-image
    runs-on: ubuntu-latest
    environment: e2e-aws
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            prefix: POSTGRES
          - engine: mysql
            prefix: MYSQL
    # The scenario uses fixed names, so runs against one cluster must not
    # overlap.
    concurrency:
      group: e2e-aws-${{ matrix.engine }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up ecspresso
        uses: kayac/ecspresso@v2
        with:
          version: v2.8.7

      - name: Run the scenario as an ECS task
        run: ecspresso run --config e2e/aws/ecspresso.yml --watch-container dbfence-e2e
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DBFENCE_E2E_ENGINE: ${{ matrix.engine }}
          DBFENCE_E2E_IMAGE: ${{ needs.aws-image.outputs.image }}
          DBFENCE_E2E_ECS_CLUSTER: ${{ vars.DBFENCE_E2E_ECS_CLUSTER }}
          # The task and service definitions read the rest from the outputs
          # in this Terraform state.
          DBFENCE_E2E_TFSTATE_URL: ${{ vars.DBFENCE_E2E_TFSTATE_URL }}

  gcp-image:
    needs: build
    runs-on: ubuntu-latest
    environment: e2e-gcp
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: dbfence-e2e
          path: e2e

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Log in to Artifact Registry
        run: gcloud auth configure-docker "${DBFENCE_E2E_ARTIFACT_REPOSITORY%%/*}" --quiet
        env:
          DBFENCE_E2E_ARTIFACT_REPOSITORY: ${{ vars.DBFENCE_E2E_ARTIFACT_REPOSITORY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "image=$REPOSITORY/dbfence-e2e:$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ vars.DBFENCE_E2E_ARTIFACT_REPOSITORY }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: e2e
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}

  gcp:
    needs: gcp-image
    runs-on: ubuntu-latest
    environment: e2e-gcp
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            prefix: POSTGRES
          - engine: mysql
            prefix: MYSQL
    # Runs against one instance must not overlap: besides the fixed names of
    # the scenario, a finishing run stops the instance.
    concurrency:
      group: e2e-gcp-${{ matrix.engine }}
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      JOB: dbfence-e2e-${{ matrix.engine }}
      REGION: ${{ vars.GCP_REGION }}
      INSTANCE: ${{ vars[format('DBFENCE_E2E_{0}_INSTANCE', matrix.prefix)] }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The instance is kept stopped (activation policy NEVER) between runs
      # to save cost. The patch returns once the instance is running.
      - name: Start the Cloud SQL instance
        id: start
        run: gcloud sql instances patch "$INSTANCE" --activation-policy ALWAYS --quiet

      - name: Deploy the Cloud Run job
        run: |
          env_file="$RUNNER_TEMP/job-env.yaml"
          {
            echo "DBFENCE_E2E_TARGET: \"gcp-$ENGINE\""
            echo "DBFENCE_E2E_HOST: \"$DB_HOST\""
            echo "DBFENCE_E2E_ADMIN_USER: \"$DB_ADMIN_USER\""
            echo "DBFENCE_E2E_ADMIN_SECRET: \"$DB_ADMIN_SECRET\""
            echo "DBFENCE_E2E_IAM_USER: \"$DB_IAM_USER\""
          } >"$env_file"
          gcloud run jobs deploy "$JOB" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --network "$RUN_NETWORK" \
            --subnet "$RUN_SUBNET" \
            --vpc-egress private-ranges-only \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 20m \
            --cpu 1 \
            --memory 512Mi \
            --env-vars-file "$env_file"
        env:
          ENGINE: ${{ matrix.engine }}
          IMAGE: ${{ needs.gcp-image.outputs.image }}
          RUN_SERVICE_ACCOUNT: ${{ vars.DBFENCE_E2E_RUN_SERVICE_ACCOUNT }}
          RUN_NETWORK: ${{ vars.DBFENCE_E2E_RUN_NETWORK }}
          RUN_SUBNET: ${{ vars.DBFENCE_E2E_RUN_SUBNET }}
          DB_HOST: ${{ vars[format('DBFENCE_E2E_{0}_HOST', matrix.prefix)] }}
          DB_ADMIN_USER: ${{ vars[format('DBFENCE_E2E_{0}_ADMIN_USER', matrix.prefix)] }}
          DB_ADMIN_SECRET: ${{ vars[format('DBFENCE_E2E_{0}_ADMIN_SECRET', matrix.prefix)] }}
          DB_IAM_USER: ${{ vars[format('DBFENCE_E2E_{0}_IAM_USER', matrix.prefix)] }}

      - name: Run the scenario
        run: gcloud run jobs execute "$JOB" --region "$REGION" --wait

      # Cloud Run does not stream job logs to the caller.
      - name: Show the job output
        if: always()
        run: |
          execution=$(gcloud run jobs executions list --job "$JOB" --region "$REGION" --sort-by '~metadata.creationTimestamp' --limit 1 --format 'value(metadata.name)')
          [ -n "$execution" ] || exit 0
          echo "execution: $execution"
          sleep 15 # log ingestion delay
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"$JOB\" AND labels.\"run.googleapis.com/execution_name\"=\"$execution\"" \
            --freshness 1d --order asc --limit 10000 --format 'value(textPayload)'

      # Also after a failure or a cancellation, once a start was attempted.
      - name: Stop the Cloud SQL instance
        if: always() && steps.start.outcome != 'skipped'
        run: gcloud sql instances patch "$INSTANCE" --activation-policy NEVER --quiet
