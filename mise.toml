[tools]
# common
"github:microsoft/apm" = "latest"
"github:rtk-ai/rtk" = "latest"
gh = "latest"

# go
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"

# goreleaser
goreleaser = "latest"

# Note: golangci-lint is intentionally NOT pinned — use the per-repo `tools/lint`
# Go module via `go tool lint ./...` (apm-plackage/go convention).
# Note: claude-code / codex / other coding-agent CLIs are intentionally NOT pinned per project policy.
# Note: python / uv / pipx-installed tools (serena, etc.) are intentionally NOT pinned
# — gopls MCP from apm-plackage/go covers Go-only code intelligence for this repo.

[tasks.test]
description = "Run unit tests (integration tests are skipped with -short)"
run = "go test -short ./..."

[tasks."test:integration"]
description = "Run all tests including dockertest-based MySQL/PostgreSQL integration tests"
run = "go test ./..."

[tasks."test:ci"]
description = "Run all tests with the race detector and coverage"
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./..."

[tasks."test:fuzz"]
description = "Run each Go fuzz target for a short time"
run = [
  "go test -run='^$' -fuzz='^FuzzCompileIgnorePattern$' -fuzztime=30s ./internal/model",
  "go test -run='^$' -fuzz='^FuzzLoad$' -fuzztime=30s ./internal/config",
  "go test -run='^$' -fuzz='^FuzzMatchPostgres$' -fuzztime=30s ./internal/password",
  "go test -run='^$' -fuzz='^FuzzMatchMySQL$' -fuzztime=30s ./internal/password",
  "go test -run='^$' -fuzz='^FuzzMatchPattern$' -fuzztime=30s ./internal/driver/mysql",
  "go test -run='^$' -fuzz='^FuzzDialectSingleStatement$' -fuzztime=30s ./internal/driver/mysql",
  "go test -run='^$' -fuzz='^FuzzDialectSingleStatement$' -fuzztime=30s ./internal/driver/postgres",
  "go test -run='^$' -fuzz='^FuzzInspectedACL$' -fuzztime=30s ./internal/driver/postgres",
]

[tasks.lint]
description = "Run the project linter"
run = "go tool lint ./..."

[tasks.generate]
description = "Regenerate kessoku injectors"
run = "go generate ./..."

[tasks."release:check"]
description = "Validate the goreleaser configuration"
run = "goreleaser check"

[tasks."release:build"]
description = "Build snapshot binaries with goreleaser"
run = "goreleaser build --snapshot --clean"

[tasks."release:publish"]
description = "Publish a release with goreleaser"
run = "goreleaser release --clean"

[tasks.apicompat]
description = "Check public Go API compatibility"
# The root package is `main` and everything else lives under internal/, so there is no public API yet.
# Wire `go tool apicompat <base> <target>` here once a public package exists.
run = "echo 'dbfence has no public Go packages; nothing to check.'"

[tasks.worktree]
run = '''
create_worktree() {
    local branch_name=$1

    # メインリポジトリのディレクトリを取得
    local git_common=$(git rev-parse --git-common-dir)
    local main_repo=$(dirname "$git_common")

    # worktreesディレクトリを作成
    local new_worktree="${main_repo}/.worktrees/${branch_name}"
    mkdir -p "$new_worktree"

    git worktree add -b "$branch_name" "$new_worktree"
    echo "✓ worktreeを作成しました: $new_worktree"
    code "$new_worktree"
}
create_worktree $1
'''
description = "Create and checkout a new git worktree"
